<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labirint O'yini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .game-area {
            width: 1300px;
            height: 500px;
            background-color: orange;
            position: relative;
            border: 3px solid red;
            overflow: hidden;
        }
        .player {
            width: 30px;
            height: 30px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 50px;
            left: 20px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        .exit {
            width: 50px;
            height: 50px;
            background-color: blue;
            position: absolute;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 255, 0.8);
        }
        .wall {
            position: absolute;
            background-color: black;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            border-radius: 5px;
        }
        .message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            font-size: 24px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }
        .restart-button {
            display: none;
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body class="bg-gray-800 flex justify-center items-center min-h-screen">
    <div class="game-area" id="gameArea">
        <div class="player" id="player"></div>
        <div class="exit" id="exit"></div>
    </div>
    <div class="message" id="gameMessage"></div>
    <button class="restart-button" id="restartButton">Qayta o'ynash</button>
    
    <script>
        const player = document.getElementById("player");
        const exit = document.getElementById("exit");
        const gameArea = document.getElementById("gameArea");
        const gameMessage = document.getElementById("gameMessage");
        const restartButton = document.getElementById("restartButton");
        
        let playerX = 20;
        let playerY = 50;
        const step = 10;
        let gameActive = false;

        function startGame() {
            gameActive = true;
            gameMessage.style.display = "none";
            restartButton.style.display = "none";
            playerX = 20;
            playerY = 50;
            player.style.left = playerX + "px";
            player.style.top = playerY + "px";
            generateWalls();
            moveExit();
            document.addEventListener("keydown", movePlayer);
        }

        function movePlayer(event) {
            if (!gameActive) return;
            if (event.key === "ArrowRight" && playerX + step < gameArea.clientWidth - 30) playerX += step;
            if (event.key === "ArrowLeft" && playerX - step > 0) playerX -= step;
            if (event.key === "ArrowUp" && playerY - step > 0) playerY -= step;
            if (event.key === "ArrowDown" && playerY + step < gameArea.clientHeight - 30) playerY += step;
            player.style.left = playerX + "px";
            player.style.top = playerY + "px";
            checkCollision();
        }
        
        function checkCollision() {
            const playerRect = player.getBoundingClientRect();
            const exitRect = exit.getBoundingClientRect();
            
            document.querySelectorAll(".wall").forEach(wall => {
                const wallRect = wall.getBoundingClientRect();
                if (playerRect.left < wallRect.right && playerRect.right > wallRect.left &&
                    playerRect.top < wallRect.bottom && playerRect.bottom > wallRect.top) {
                    gameOver("O'yin tugadi!");
                }
            });
            
            if (playerRect.left >= exitRect.left && playerRect.right <= exitRect.right &&
                playerRect.top >= exitRect.top && playerRect.bottom <= exitRect.bottom) {
                gameOver("Siz yutdingiz!");
            }
        }
        
        function gameOver(message) {
            gameMessage.textContent = message;
            gameMessage.style.display = "block";
            restartButton.style.display = "block";
            gameActive = false;
            document.removeEventListener("keydown", movePlayer);
        }
        
        function generateWalls() {
            document.querySelectorAll(".wall").forEach(e => e.remove());
            for (let i = 0; i < 15; i++) {
                let wall = document.createElement("div");
                wall.classList.add("wall");
                let isVertical = Math.random() > 0.5;
                wall.style.width = isVertical ? "20px" : Math.random() * 100 + 40 + "px";
                wall.style.height = isVertical ? Math.random() * 100 + 40 + "px" : "20px";
                wall.style.left = Math.random() * (gameArea.clientWidth - 120) + "px";
                wall.style.top = Math.random() * (gameArea.clientHeight - 120) + "px";
                gameArea.appendChild(wall);
            }
        }

        function moveExit() {
            exit.style.left = Math.random() * (gameArea.clientWidth - 50) + "px";
            exit.style.top = Math.random() * (gameArea.clientHeight - 50) + "px";
        }

        restartButton.addEventListener("click", startGame);
        startGame();
        setInterval(() => {
            generateWalls();
            moveExit();
        }, 5000);
    </script>
</body>
</html>
